name: Android CI

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.2.4) to create and publish a GitHub Release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build, Test, and Optional Release
    runs-on: ubuntu-latest
    steps:
      - name: Checking out branch
        uses: actions/checkout@v7

      - name: Determine Build Mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "release" || "$EVENT_NAME" == "workflow_dispatch" || "$REF_NAME" == refs/tags/* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Release Secrets
        if: steps.mode.outputs.is_release == 'true'
        shell: bash
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for var in KEYSTORE_BASE_64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEYSTORE_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required repository secret: $var"
              exit 1
            fi
          done

      - name: Setup Shared Android Environment
        uses: ./.github/actions/setup-android-env
        with:
          keystore-b64: ${{ steps.mode.outputs.is_release == 'true' && secrets.KEYSTORE_BASE_64 || '' }}
          keystore-password: ${{ steps.mode.outputs.is_release == 'true' && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
          keystore-alias: ${{ steps.mode.outputs.is_release == 'true' && secrets.RELEASE_KEYSTORE_ALIAS || '' }}
          key-password: ${{ steps.mode.outputs.is_release == 'true' && secrets.RELEASE_KEY_PASSWORD || '' }}

      - name: Run Tests with Gradle
        if: steps.mode.outputs.is_release != 'true'
        run: ./gradlew test

      - name: Run Tests and Build Release APK
        if: steps.mode.outputs.is_release == 'true'
        run: ./gradlew test assembleRelease

      - name: Verify Signed Release APK
        if: steps.mode.outputs.is_release == 'true'
        shell: bash
        run: |
          ls -la app/build/outputs/apk/release/
          if ! compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            echo "::error::No release APK found"
            exit 1
          fi
          if compgen -G "app/build/outputs/apk/release/*-unsigned.apk" > /dev/null; then
            echo "::error::Release APK is unsigned"
            exit 1
          fi

      - name: Publish GitHub Release (from Release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (from tag push)
        id: publish_release_tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Fallback Publish GitHub Release (via gh CLI)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.publish_release_tag.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if ! gh release create "$TAG_NAME" app/build/outputs/apk/release/*.apk --title "$TAG_NAME" --generate-notes $PRERELEASE_FLAG; then
            echo "Retrying release creation without --generate-notes..."
            gh release create "$TAG_NAME" app/build/outputs/apk/release/*.apk --title "$TAG_NAME" --notes "Release $TAG_NAME" $PRERELEASE_FLAG
          fi

      - name: Publish GitHub Release (from manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
