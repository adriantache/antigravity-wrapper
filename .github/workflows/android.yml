name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) to create and publish a GitHub Release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build, Test, and Optional Release
    runs-on: ubuntu-latest
    steps:
      - name: Checking out branch
        uses: actions/checkout@v7

      - name: Validate Release Secrets
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for var in KEYSTORE_BASE_64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEYSTORE_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required repository secret: $var"
              exit 1
            fi
          done

      - name: Setup Shared Android Environment
        uses: ./.github/actions/setup-android-env
        with:
          keystore-b64: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && secrets.KEYSTORE_BASE_64 || '' }}
          keystore-password: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
          keystore-alias: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && secrets.RELEASE_KEYSTORE_ALIAS || '' }}
          key-password: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && secrets.RELEASE_KEY_PASSWORD || '' }}

      - name: Run Tests with Gradle
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: ./gradlew test

      - name: Run Tests and Build Release APK
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: ./gradlew test assembleRelease

      - name: Verify Signed Release APK
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          ls -la app/build/outputs/apk/release/
          if ! compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            echo "::error::No release APK found"
            exit 1
          fi
          if compgen -G "app/build/outputs/apk/release/*-unsigned.apk" > /dev/null; then
            echo "::error::Release APK is unsigned"
            exit 1
          fi

      - name: Publish GitHub Release (from Release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (from manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
